{% extends 'base.html' %}
{% load static %}
{% block title %}Product List{% endblock %}

{% block content %}
    <!--=========================================-->
    <h2>Product List</h2>
    <br>
    <!-- Row -->
    <div class="row row-sm">
        <div class="col-lg-12">
            <div class="card custom-card">
                <div class="card-body">
                    <div class="mb-3">
                        <button type="button" class="btn btn-primary" id="new" data-bs-toggle="modal"
                                data-bs-target="#NewAndEditModal" title="新增">
                        </button>
                    </div>
                    <div class="table-responsive ">
                        <table id="datatable"
                               class="table table-bordered dt-responsive nowrap table-striped align-middle hover"
                               style="width:100%">
                            <thead class="table-head">
                            <tr class="css-table-row">
                                <th scope="col">id</th>
                                <th scope="col">Product_name</th>
                                <th scope="col">price</th>
                                <th scope="col">img</th>
                                <th scope="col">op</th>
                            </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- End Row -->

    <!-- NEW and EDIT Modal -->
    <div class="modal fade" id="NewAndEditModal" role="dialog">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="productForm" class="form-group" role="form">
                    {% csrf_token %}
                    <div class="modal-header">
                        <h3 class="modal-title" id="modal_title"></h3>
                        <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-md-12 form-group">
                                <label for="id">商品編號</label>
                                <input type="text" class="form-control" id="id" name="id" readonly
                                       placeholder="系統自動產生">
                            </div>
                            <div class="col-md-12 form-group">
                                <label for="name">商品名</label><span class="text-danger ml-1"
                                                                      style="color:red"> *</span>
                                <input type="text" class="form-control" id="name" name="name" placeholder="請輸入商品名"
                                       required>
                            </div>

                            <div class="col-md-12 form-group">
                                <label For="price">商品價格</label><span class="text-danger ml-1"
                                                                         style="color:red"> *</span>
                                <input type="number" class="form-control" id="price" name="price" min="1"
                                       onInput="this.value = this.value.replace(/[^0-9]/g, '');"
                                       placeholder="請輸入商品價格"
                                       required/>
                                       required/>
                            </div>
                            <div class="mb-3">
                                <label for="image1" class="form-label">商品圖片</label>
                                <div id="image-preview-container" class="mb-2"
                                     style="display: none; position: relative; width: fit-content;">
                                    <p class="small text-muted">目前圖片：</p>
                                    <img id="current-image-preview" src="" alt="預覽"
                                         style="max-width: 150px; border: 1px solid #ddd;">
                                    <button type="button" id="clear-image-btn" class="btn btn-danger btn-sm"
                                            style="position: absolute; top: 30px; right: -10px; border-radius: 50%; padding: 2px 6px;">
                                        &times;
                                    </button>
                                    <input type="hidden" id="clear_image" name="clear_image" value="false">
                                </div>
                                <input type="file" class="form-control" id="image1" name="image1" accept="image/*">
                            </div>
                        </div>
                    </div>
                    <input type="hidden" id="type" name="type" value="">

                    <div class="modal-footer">
                        <button type="submit" class="btn ripple btn-primary"><i class="bx bx-save"></i> 存檔</button>
                        <button class="btn ripple btn-light" data-bs-dismiss="modal" type="button"><i
                                class="ri-close-line"></i> 取消
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <!-- END NEW and EDIT Modal -->
    <!-- Delete Modal -->
    <div class="modal fade" id="DeleteModal" role="dialog" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title" id="delete_modal_title"></h4>
                    <small class="modal-subtitle"></small>
                    <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
                </div>
                <div class="modal-body text-center">
                    <p class="lead">你確認要刪除：<strong id="delid" class="text-danger"></strong> 嗎？</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn ripple btn-danger" id="delete">
                        <i class="bx bx-trash"></i> 刪除
                    </button>
                    <button type="button" class="btn ripple btn-light" data-bs-dismiss="modal">
                        <i class="ri-close-line"></i> 取消
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- END Delete Modal -->

    <div id="result"></div>

{% endblock %}


<!--=========================-->
{% block scripts %}
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- sweetalert2 js-->
    <script src="{% static 'libs/sweetalert2/dist/sweetalert2.all.min.js' %}"></script>
    <script src="{% static 'js/inits/sweetalert2.init.js' %}"></script>
    <!--  Datatable js -->
    <script src="{% static 'libs/datatable/js/jquery.dataTables.min.js' %}"></script>
    <script src="{% static 'libs/datatable/js/dataTables.bootstrap5.min.js' %}"></script>
    <script src="{% static 'libs/datatable/js/dataTables.buttons.min.js' %}"></script>
    <script src="{% static 'libs/datatable/js/dataTables.responsive.min.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {#    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>#}
    <script src="{% static 'js/products.js' %}"></script>
{% endblock %}
