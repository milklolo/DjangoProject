{% extends 'base.html' %}

{% block title %}Sales List{% endblock %}

{% block content %}
<!--=========================================-->
<h2>Sales List</h2>
<form id="sales-form">
    <input type="hidden" id="sales-id" name="id"> <!-- 狀態 -->
    <input type="text" name="name" required>
    <button type="submit" id="add">Add sales</button>
    <button type="submit" id="edit" style="display:none;">確認修改</button>
    <button type="button" id="cancel-edit" style="display:none;">取消修改</button>
</form>

<table id="sales-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Sales</th>
            <th>OP</th>
        </tr>
    </thead>
    <tbody>

    </tbody>
</table>

<div id="result"></div>

{% endblock %}


<!--=========================-->
{% block scripts %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function() {
        loadSales();
        // 新增
        $('#sales-form').submit(function(e) {
            e.preventDefault();  // 阻止表單默認提交行為，防止頁面重載
            let id = $('#sales-id').val();
            let name = $("input[name='name']").val();// 獲取表單數據
            let url = '/sales/';
            let method = 'POST';
            let salesData = {
                name: name
            };
            // 如果有 ID，代表是修改模式
            if (id) {
                url = `/sales/${id}/`; // 指向特定物件的 URL
                method = 'PUT';        // 或者用 'PATCH'
            }

            $.ajax({
                url: url,  // 發送請求的 URL
                method: method,  // 使用 POST 請求
                contentType: 'application/json',  // 設定請求內容類型
                data: JSON.stringify(salesData),  // 發送的資料，轉為 JSON 格式
                headers: {
                    "X-CSRFToken": getCookie("csrftoken")  // 添加 CSRF token
                },
                success: function(data) {if (id) {
                    // 修改成功：更新該行資料
                    $(`tr[data-id="${id}"] td:nth-child(2)`).text(data.name);
                    $("#result").text("更新成功：" + data.name);
                    $('#sales-id').val('');           // 清空隱藏 ID
                    $('#sales-form')[0].reset();
                    $('#cancel-edit').click(); // 重置表單
                } else {
                    // 新增成功：原本的邏輯
                    $("#result").text("新增成功：" + data.name);
                    $("#sales-table tbody").append(addRow(data));
                    $('#sales-form')[0].reset();
                }},
                error: function(err) {
                    console.log(err.responseJSON);  // 如果出錯，打印錯誤信息
                }
            });
        });
        // 修改
        $('#sales-table').on('click', '.edit-btn', function() {
            const row = $(this).closest('tr');
            const id = row.data('id');
            const name = row.find('td:nth-child(2)').text();
            // 1. 將資料填入表單
            $('#sales-id').val(id);
            $("input[name='name']").val(name);
            // 2. 切換按鈕文字與顯示取消按鈕
            $('#cancel-edit').show();
            $('#edit').show();
            $('#add').hide();
        });

        // 點擊取消修改
        $('#cancel-edit').click(function() {
            $('#sales-id').val('');
            $('#sales-form')[0].reset();
            $('#edit').hide();
            $('#add').show();
            $(this).hide();
        });

        // 刪除
        $('#sales-table').on('click', '.delete-btn', function() {
            const row = $(this).closest('tr');  // 獲取當前行
            const salesId = row.data('id');  // 從 data-id 屬性中獲取訂單 ID

            if (!salesId) {
                console.log("未能找到 ID，無法刪除");
                return;
            }
            $.ajax({
                url: `/sales/${salesId}/`,  // 使用訂單 ID 組成正確的 URL
                method: 'DELETE',
                headers: {
                    "X-CSRFToken": getCookie("csrftoken")
                },
                success: function() {
                    row.remove();  // 刪除表格中的該行
                },
                error: function(err) {
                    console.log(err.responseJSON);
                }
            });
        });

        // 獲取 CSRF Token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let cookie of cookies) {
                    cookie = cookie.trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // 銷售列表
        function loadSales() {
            $.get('/sales/', function(data) {
                console.log(data);
                $("#sales-table tbody").empty();
                data.forEach(function(sales) {
                    $("#sales-table tbody").append(addRow(sales));
                });
            });
        }
        // 列出所有表
        function addRow(sales) {
            return `
                <tr data-id="${sales.id}"><!-- 記得要加id，CRUD用的 -->
                    <td>${sales.id}</td>
                    <td>${sales.name}</td>
                    <td>
                        <button class="edit-btn">修改</button>
                        <button class="delete-btn">刪除</button>
                    </td>
                </tr>
            `;
        }
    });
</script>
{% endblock %}
